# MQDMS auth stack (auth.mqdms.com), deploy via Coolify Git-based Docker
# Compose Application.
#
# GH Actions builds auth/worker/migrate and pushes them to GHCR.
# This Compose file only PULLS the application images.
#
# The business application (app.mqdms.com) lives in its own Coolify resource
# (`docker-compose.coolify.app.yml`) and connects to the same database over
# the private network. The HTTP auth handler exists only in this stack.

x-runtime-env: &runtime-env
  NODE_ENV: production
  APP_ENV: production
  DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
  REDIS_URL: redis://redis:6379
  QUEUE_PREFIX: ${QUEUE_PREFIX:-mqdms}
  NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?NEXT_PUBLIC_APP_URL is required}
  NEXT_PUBLIC_AUTH_URL: ${NEXT_PUBLIC_AUTH_URL:?NEXT_PUBLIC_AUTH_URL is required}
  NEXT_PUBLIC_BUSINESS_APP_URL: ${NEXT_PUBLIC_BUSINESS_APP_URL:?NEXT_PUBLIC_BUSINESS_APP_URL is required}
  BETTER_AUTH_URL: ${BETTER_AUTH_URL:?BETTER_AUTH_URL is required}
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is required}
  # Kesin origin listesi; wildcard kullanılmaz.
  AUTH_TRUSTED_ORIGINS: ${AUTH_TRUSTED_ORIGINS:?AUTH_TRUSTED_ORIGINS is required}
  # Paylaşımlı oturum cookie'sinin alan adı (ör. `.mqdms.com`). İki deploy'un
  # aynı oturumu paylaşması için zorunludur.
  AUTH_COOKIE_DOMAIN: ${AUTH_COOKIE_DOMAIN:?AUTH_COOKIE_DOMAIN is required}
  RESEND_API_KEY: ${RESEND_API_KEY:?RESEND_API_KEY is required}
  RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:?RESEND_FROM_EMAIL is required}
  STORAGE_BUCKET: ${STORAGE_BUCKET:?STORAGE_BUCKET is required}
  STORAGE_REGION: ${STORAGE_REGION:-auto}
  STORAGE_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY_ID:?STORAGE_ACCESS_KEY_ID is required}
  STORAGE_SECRET_ACCESS_KEY: ${STORAGE_SECRET_ACCESS_KEY:?STORAGE_SECRET_ACCESS_KEY is required}
  STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:-}
  STORAGE_PUBLIC_URL: ${STORAGE_PUBLIC_URL:-}
  # Bootstrap akışı çalışma zamanında okunur (build-time değeri etkisiz):
  # sayfa `force-dynamic` ve bu değişkenler `NEXT_PUBLIC_` önekli olmadığı
  # için sunucuda container ortamından gelir. Varsayılan kapalı; açmak için
  # Coolify'da iki değişkeni de tanımla.
  ORG_BOOTSTRAP_ENABLED: ${ORG_BOOTSTRAP_ENABLED:-false}
  ORG_BOOTSTRAP_KEY: ${ORG_BOOTSTRAP_KEY:-}

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: mqdms
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mqdms"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    image: ghcr.io/uzansadik/mqdms/migrate:${APP_TAG:-latest}
    pull_policy: always
    restart: "no"
    exclude_from_hc: true # Coolify-specific: completed job is not unhealthy.
    environment: *runtime-env
    depends_on:
      postgres:
        condition: service_healthy

  auth:
    image: ghcr.io/uzansadik/mqdms/auth:${APP_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    environment: *runtime-env
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    image: ghcr.io/uzansadik/mqdms/worker:${APP_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    environment:
      <<: *runtime-env
      WORKER_QUEUES: ${WORKER_QUEUES:-default,email}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
  redis_data:
