name: CI

# Pull request'lerde yalnızca kod doğrulanır (typecheck, format, lint).
# Image'lar yalnızca main'e push/merge edildiğinde üretilir ve GHCR'a
# gönderilir; üretim Coolify tarafından otomatik deploy edilir.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}

permissions:
  contents: read

jobs:
  verify:
    name: Kodu doğrula
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.23.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Bağımlılıkları kur
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Format kontrolü
        run: pnpm exec biome format .

      # Vendored shadcn bileşenlerinde ve legacy dosyalarda bilinen bulgular
      # var; bunlar temizlenene kadar CI'ı bloklamıyor.
      - name: Lint (bilgilendirme amaçlı)
        continue-on-error: true
        run: pnpm exec biome lint .

  build:
    name: İmajları derle
    needs: verify
    # Image'lar yalnızca main'de üretilir: PR'lerde build çalıştırmak runner
    # süresi ve cache kapsamı harcar, ortada çıktı bırakmaz.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: GHCR'a giriş
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta-auth
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/mqdms/auth
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - id: meta-worker
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/mqdms/worker
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - id: meta-migrate
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/mqdms/migrate
          tags: |
            type=raw,value=latest
            type=sha,format=short

      # Migration image'ı build sırasında env doğrulamaz; env şeması çalışma
      # anında, container içinde doğrulanıyor.
      - name: migrate imajı
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/migrate.Dockerfile
          push: true
          tags: ${{ steps.meta-migrate.outputs.tags }}
          labels: ${{ steps.meta-migrate.outputs.labels }}
          provenance: false
          cache-from: type=gha,scope=migrate
          cache-to: type=gha,scope=migrate,mode=max

      # `next build` route handler'ları yüklerken `@mqdms/env` şemasını
      # doğruladığı için build sırasında da env gerekiyor. Gerçek sırlar
      # image'a gömülmez; secret yoksa build-only placeholder kullanılır.
      # NEXT_PUBLIC_APP_URL istisnadır: client bundle'a işlendiği için repo
      # variable'ı tanımlanmalı (Settings -> Variables).
      - name: auth imajı
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/auth.Dockerfile
          push: true
          tags: ${{ steps.meta-auth.outputs.tags }}
          labels: ${{ steps.meta-auth.outputs.labels }}
          provenance: false
          build-args: |
            DATABASE_URL=postgresql://postgres:postgres@localhost:5432/mqdms
            REDIS_URL=redis://localhost:6379
            QUEUE_PREFIX=mqdms
            NEXT_PUBLIC_APP_URL=${{ vars.NEXT_PUBLIC_APP_URL || 'http://localhost:3000' }}
            BETTER_AUTH_URL=${{ vars.BETTER_AUTH_URL || 'http://localhost:3000' }}
            BETTER_AUTH_SECRET=${{ secrets.BETTER_AUTH_SECRET || 'ci-build-placeholder-secret-000000000000' }}
            RESEND_API_KEY=${{ secrets.RESEND_API_KEY || 're_ci_build_placeholder' }}
            RESEND_FROM_EMAIL=${{ secrets.RESEND_FROM_EMAIL || 'build@example.com' }}
            STORAGE_BUCKET=${{ vars.STORAGE_BUCKET || 'build' }}
            STORAGE_REGION=${{ vars.STORAGE_REGION || 'auto' }}
            STORAGE_ACCESS_KEY_ID=${{ secrets.STORAGE_ACCESS_KEY_ID || 'build' }}
            STORAGE_SECRET_ACCESS_KEY=${{ secrets.STORAGE_SECRET_ACCESS_KEY || 'build' }}
            STORAGE_ENDPOINT=${{ vars.STORAGE_ENDPOINT || 'http://localhost:3000' }}
            STORAGE_PUBLIC_URL=${{ vars.STORAGE_PUBLIC_URL || 'http://localhost:3000' }}
          cache-from: type=gha,scope=auth
          cache-to: type=gha,scope=auth,mode=max

      - name: worker imajı
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/worker.Dockerfile
          push: true
          tags: ${{ steps.meta-worker.outputs.tags }}
          labels: ${{ steps.meta-worker.outputs.labels }}
          provenance: false
          cache-from: type=gha,scope=worker
          cache-to: type=gha,scope=worker,mode=max

      - name: Özet
        run: |
          echo "### Derlenen image'lar" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta-auth.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta-worker.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta-migrate.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy'u tetikle
    needs: build
    # Deploy, image'lar push edildikten sonra tetiklenir: aksi halde
    # Coolify, push'tan hemen sonra `latest` etiketini çekip eski image'ı
    # deploy edebilir.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read

    env:
      # Coolify'nin "Deploy Webhook" adresi (Application -> Deploy Webhook).
      # Secret tanımlı değilse deploy tetiklenmez.
      COOLIFY_DEPLOY_WEBHOOK: ${{ secrets.COOLIFY_DEPLOY_WEBHOOK }}
      # Coolify API token'ı (Keys & Tokens -> API Tokens, `deploy` izni).
      # Deploy webhook'u Bearer token ile doğrulanır; token olmadan istek
      # 401 (Unauthorized) ile reddedilir.
      COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}

    steps:
      - name: Coolify deploy webhook'ini çağır
        if: env.COOLIFY_DEPLOY_WEBHOOK != '' && env.COOLIFY_API_TOKEN != ''
        run: |
          curl --fail-with-body --silent --show-error --retry 3 --retry-delay 5 \
            --header "Authorization: Bearer $COOLIFY_API_TOKEN" \
            --request POST "$COOLIFY_DEPLOY_WEBHOOK"
