  - '@better-auth/memory-adapter@1.7.20'
  - '@better-auth/mongo-adapter@1.7.20'
  - '@better-auth/prisma-adapter@1.7.20'
  - '@better-auth/telemetry@1.7.20'
  - better-auth@1.7.20
